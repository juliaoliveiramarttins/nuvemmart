<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Entrar — NuvemMart</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="app-header"></div>
    <div
      class="page-wrapper"
      style="
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 48px 24px;
      "
    >
      <div style="width: 100%; max-width: 440px">
        <div style="text-align: center; margin-bottom: 32px">
          <div
            style="
              font-family: var(--font-display);
              font-size: 3rem;
              background: linear-gradient(
                135deg,
                var(--accent),
                var(--accent2)
              );
              -webkit-background-clip: text;
              -webkit-text-fill-color: transparent;
              background-clip: text;
            "
          >
            NuvemMart
          </div>
          <p class="text-muted text-sm" style="margin-top: 4px">
            Acesse sua conta ou crie uma nova
          </p>
        </div>

        <div class="card">
          <div class="card-body">
            <div class="tabs" id="auth-tabs">
              <button class="tab-btn active" data-tab="login">Entrar</button>
              <button class="tab-btn" data-tab="register">Criar conta</button>
            </div>

            <!-- LOGIN -->
            <div class="tab-content active" id="tab-login">
              <div id="login-error"></div>
              <div style="display: flex; flex-direction: column; gap: 14px">
                <div class="form-group">
                  <label>E-mail</label>
                  <input
                    type="email"
                    id="login-email"
                    placeholder="seu@email.com"
                  />
                </div>
                <div class="form-group">
                  <label>CPF</label>
                  <input
                    type="text"
                    id="login-cpf"
                    placeholder="000.000.000-00"
                    maxlength="14"
                  />
                </div>
                <button class="btn btn-primary btn-full" onclick="doLogin()">
                  Entrar →
                </button>
              </div>
              <div class="divider"></div>
              <p class="text-muted text-sm" style="text-align: center">
                Login administrativo:
                <a href="admin-produtos.html" style="color: var(--accent3)"
                  >Painel Admin</a
                >
              </p>
            </div>

            <!-- REGISTER -->
            <div class="tab-content" id="tab-register">
              <div id="register-error"></div>
              <div style="display: flex; flex-direction: column; gap: 14px">
                <div class="form-group">
                  <label>Nome completo *</label>
                  <input type="text" id="reg-nome" placeholder="Seu nome" />
                </div>
                <div class="form-row cols-2">
                  <div class="form-group">
                    <label>CPF *</label>
                    <input
                      type="text"
                      id="reg-cpf"
                      placeholder="000.000.000-00"
                      maxlength="14"
                    />
                  </div>
                  <div class="form-group">
                    <label>Telefone</label>
                    <input type="text" id="reg-tel" placeholder="(11) 9..." />
                  </div>
                </div>
                <div class="form-group">
                  <label>E-mail *</label>
                  <input
                    type="email"
                    id="reg-email"
                    placeholder="seu@email.com"
                  />
                </div>
                <div class="form-group">
                  <label>Endereço</label>
                  <input
                    type="text"
                    id="reg-end"
                    placeholder="Rua, número, bairro"
                  />
                </div>
                <div class="form-row cols-2">
                  <div class="form-group">
                    <label>Cidade</label>
                    <input type="text" id="reg-cidade" placeholder="Cidade" />
                  </div>
                  <div class="form-group">
                    <label>CEP</label>
                    <input
                      type="text"
                      id="reg-cep"
                      placeholder="00000-000"
                      maxlength="9"
                    />
                  </div>
                </div>
                <button class="btn btn-primary btn-full" onclick="doRegister()">
                  Criar conta →
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="js/azure-config.js"></script>
    <script src="js/services.js"></script>
    <script src="js/ui.js"></script>
    <script>
      renderHeader(false);
      document.querySelectorAll("#auth-tabs .tab-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          document
            .querySelectorAll("#auth-tabs .tab-btn")
            .forEach((b) => b.classList.remove("active"));
          document
            .querySelectorAll(".tab-content")
            .forEach((c) => c.classList.remove("active"));
          btn.classList.add("active");
          document
            .getElementById("tab-" + btn.dataset.tab)
            .classList.add("active");
        });
      });

      if (location.hash === "#register") {
        document
          .querySelectorAll("#auth-tabs .tab-btn")
          .forEach((b) => b.classList.remove("active"));
        document
          .querySelectorAll(".tab-content")
          .forEach((c) => c.classList.remove("active"));
        document.querySelector('[data-tab="register"]').classList.add("active");
        document.getElementById("tab-register").classList.add("active");
      }

      if (SessionService.isLogged()) location.href = "index.html";

      function maskCPF(input) {
        input.addEventListener("input", () => {
          let v = input.value.replace(/\D/g, "");
          if (v.length > 11) v = v.slice(0, 11);
          v = v
            .replace(/(\d{3})(\d)/, "$1.$2")
            .replace(/(\d{3})(\d)/, "$1.$2")
            .replace(/(\d{3})(\d{1,2})$/, "$1-$2");
          input.value = v;
        });
      }
      maskCPF(document.getElementById("login-cpf"));
      maskCPF(document.getElementById("reg-cpf"));

      async function doLogin() {
        const email = document.getElementById("login-email").value.trim();
        const cpf = document.getElementById("login-cpf").value.trim();
        const errEl = document.getElementById("login-error");
        errEl.innerHTML = "";
        if (!email || !cpf) {
          errEl.innerHTML = `<div class="alert alert-error">Preencha e-mail e CPF.</div>`;
          return;
        }
        showLoader("Verificando...");
        try {
          await initStorage();
          const clientes = await ClientesService.listar();
          const found = clientes.find(
            (c) =>
              c.Email?.toLowerCase() === email.toLowerCase() &&
              c.CPF?.replace(/\D/g, "") === cpf.replace(/\D/g, ""),
          );
          if (!found) {
            errEl.innerHTML = `<div class="alert alert-error">E-mail ou CPF inválidos.</div>`;
            return;
          }
          SessionService.setCliente(found);
          showToast(`Bem-vindo(a), ${found.Nome}!`, "success");
          setTimeout(() => (location.href = "index.html"), 600);
        } catch (e) {
          errEl.innerHTML = `<div class="alert alert-error">${e.message}</div>`;
        } finally {
          hideLoader();
        }
      }

      async function doRegister() {
        const nome = document.getElementById("reg-nome").value.trim();
        const cpf = document.getElementById("reg-cpf").value.trim();
        const email = document.getElementById("reg-email").value.trim();
        const errEl = document.getElementById("register-error");
        errEl.innerHTML = "";
        if (!nome || !cpf || !email) {
          errEl.innerHTML = `<div class="alert alert-error">Preencha os campos obrigatórios (*).</div>`;
          return;
        }
        showLoader("Cadastrando...");
        try {
          await initStorage();
          const existing = (await ClientesService.listar()).find(
            (c) => c.Email?.toLowerCase() === email.toLowerCase(),
          );
          if (existing) {
            errEl.innerHTML = `<div class="alert alert-error">Este e-mail já está cadastrado.</div>`;
            return;
          }
          const novo = await ClientesService.salvar({
            nome,
            cpf,
            email,
            telefone: document.getElementById("reg-tel").value,
            endereco: document.getElementById("reg-end").value,
            cidade: document.getElementById("reg-cidade").value,
            cep: document.getElementById("reg-cep").value,
          });
          SessionService.setCliente(novo);
          showToast("Cadastro realizado com sucesso!", "success");
          setTimeout(() => (location.href = "index.html"), 600);
        } catch (e) {
          errEl.innerHTML = `<div class="alert alert-error">${e.message}</div>`;
        } finally {
          hideLoader();
        }
      }
    </script>
  </body>
</html>
