<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produtos — NuvemMart</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app-header"></div>
  <div class="page-wrapper">
    <div class="container">
      <div class="page-header mt-2">
        <h2>Produtos</h2>
      </div>

      <div class="search-bar">
        <div class="form-group">
          <label>Marca</label>
          <input type="text" id="f-marca" placeholder="Ex: Apple">
        </div>
        <div class="form-group">
          <label>Modelo</label>
          <input type="text" id="f-modelo" placeholder="Ex: Ipad">
        </div>
        <div class="form-group">
          <label>Preço mín.</label>
          <input type="number" id="f-min" placeholder="0">
        </div>
        <div class="form-group">
          <label>Preço máx.</label>
          <input type="number" id="f-max" placeholder="9999">
        </div>
        <button class="btn btn-primary" onclick="loadProducts()">Buscar</button>
        <button class="btn btn-ghost" onclick="clearFilters()">Limpar</button>
      </div>

      <div id="product-count" class="text-muted text-sm" style="margin-bottom:16px"></div>
      <div class="products-grid" id="products-grid">
        <div style="grid-column:1/-1;text-align:center;padding:64px">
          <div class="loader" style="border-top-color:var(--accent3)"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/azure-config.js"></script>
  <script src="js/services.js"></script>
  <script src="js/ui.js"></script>
  <script>
    renderHeader(false);
    async function loadProducts() {
      const grid = document.getElementById('products-grid');
      grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:40px"><div class="loader" style="border-top-color:var(--accent3)"></div></div>`;
      const filtros = {
        marca: document.getElementById('f-marca').value,
        modelo: document.getElementById('f-modelo').value,
        precoMin: document.getElementById('f-min').value,
        precoMax: document.getElementById('f-max').value,
      };
      const produtos = (await ProdutosService.listar(filtros)).filter(p => p.Ativo !== false);
      document.getElementById('product-count').textContent = `${produtos.length} produto(s) encontrado(s)`;
      if (produtos.length === 0) {
        grid.innerHTML = `<div style="grid-column:1/-1" class="empty-state"><div class="icon">🔍</div><h3>Nenhum produto encontrado</h3></div>`;
        return;
      }
      grid.innerHTML = produtos.map(p => {
        const img = p.ImagemUrl
          ? `<img class="product-img" src="${getBlobUrl(p.ImagemUrl)}" alt="${p.Modelo}" onerror="this.parentElement.innerHTML='<div class=product-img-placeholder>📦</div>'">`
          : `<div class="product-img-placeholder">📦</div>`;
        const stock = parseInt(p.Quantidade);
        return `<div class="product-card">
          ${img}
          <div class="product-info">
            <div class="product-brand">${p.Marca}</div>
            <div class="product-name">${p.Modelo}</div>
            ${p.Descricao ? `<div class="text-muted text-sm" style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${p.Descricao}</div>` : ''}
            <div class="product-price">${formatCurrency(p.Valor)}</div>
            <div class="product-stock">${stock > 0 ? `${stock} em estoque` : '<span style="color:var(--danger)">Indisponível</span>'}</div>
          </div>
          <div class="product-actions">
            ${stock > 0 ? `<button class="btn btn-primary btn-sm" style="flex:1" onclick='addToCart(${JSON.stringify(p).replace(/'/g,"&#39;")})'>+ Carrinho</button>` : `<button class="btn btn-ghost btn-sm" style="flex:1" disabled>Indisponível</button>`}
            <button class="btn btn-ghost btn-sm" onclick="location.href='produto.html?id=${p.RowKey}'">Ver</button>
          </div>
        </div>`;
      }).join('');
    }
    function clearFilters() {
      ['f-marca','f-modelo','f-min','f-max'].forEach(id => document.getElementById(id).value = '');
      loadProducts();
    }
    function addToCart(p) {
      CartService.add(p); showToast(`${p.Marca} ${p.Modelo} adicionado!`, 'success');
    }
    initStorage().then(loadProducts);
  </script>
</body>
</html>
