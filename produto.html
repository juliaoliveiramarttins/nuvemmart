<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produto — NuvemMart</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app-header"></div>
  <div class="page-wrapper">
    <div class="container">
      <button class="btn btn-ghost btn-sm mt-2" onclick="history.back()">← Voltar</button>
      <div id="product-content" style="margin-top:24px">
        <div style="text-align:center;padding:64px"><div class="loader" style="border-top-color:var(--accent3)"></div></div>
      </div>
    </div>
  </div>

  <script src="js/azure-config.js"></script>
  <script src="js/services.js"></script>
  <script src="js/ui.js"></script>
  <script>
    renderHeader(false);
    async function loadProduct() {
      const id = new URLSearchParams(location.search).get('id');
      if (!id) { location.href = 'produtos.html'; return; }
      await initStorage();
      const p = await ProdutosService.buscarPorId(id);
      if (!p) { document.getElementById('product-content').innerHTML = `<div class="empty-state"><div class="icon">❌</div><h3>Produto não encontrado</h3></div>`; return; }
      const stock = parseInt(p.Quantidade);
      const img = p.ImagemUrl
        ? `<img class="product-detail-img" src="${getBlobUrl(p.ImagemUrl)}" alt="${p.Modelo}" onerror="this.style.background='var(--surface)'"`
        : `<div class="product-detail-img" style="display:flex;align-items:center;justify-content:center;font-size:5rem;background:var(--surface)">📦</div>`;
      document.title = `${p.Marca} ${p.Modelo} — NuvemMart`;
      document.getElementById('product-content').innerHTML = `
        <div class="product-detail-grid">
          <div>${img}</div>
          <div class="product-detail-info">
            <div>
              <div class="product-brand" style="font-size:0.85rem;color:var(--accent);font-weight:600;text-transform:uppercase;letter-spacing:.1em;margin-bottom:4px">${p.Marca}</div>
              <h2 style="font-family:var(--font-display);font-size:2.5rem;line-height:1.1;margin-bottom:12px">${p.Modelo}</h2>
              ${p.Descricao ? `<p style="color:var(--text2);line-height:1.7">${p.Descricao}</p>` : ''}
            </div>
            <div class="divider"></div>
            <div class="product-detail-price">${formatCurrency(p.Valor)}</div>
            <div class="${stock < 5 && stock > 0 ? 'badge badge-warn' : stock === 0 ? 'badge badge-danger' : 'badge badge-success'}">
              ${stock > 0 ? `${stock} em estoque` : 'Indisponível'}
            </div>
            ${stock > 0 ? `
            <div class="qty-selector">
              <label style="font-size:.82rem;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.05em">Quantidade</label>
              <button class="qty-btn" onclick="changeQty(-1)">−</button>
              <input type="number" id="qty-input" value="1" min="1" max="${stock}" style="width:64px;text-align:center">
              <button class="qty-btn" onclick="changeQty(1)">+</button>
            </div>
            <button class="btn btn-primary btn-lg btn-full" onclick="addToCart()">🛒 Adicionar ao Carrinho</button>
            <button class="btn btn-secondary btn-full" onclick="buyNow()">Comprar Agora →</button>
            ` : `<button class="btn btn-ghost btn-full" disabled>Produto Indisponível</button>`}
          </div>
        </div>`;
      window._currentProduct = p;
    }
    function changeQty(delta) {
      const input = document.getElementById('qty-input');
      const max = parseInt(window._currentProduct?.Quantidade || 1);
      let v = parseInt(input.value) + delta;
      v = Math.max(1, Math.min(max, v));
      input.value = v;
    }
    function addToCart() {
      const p = window._currentProduct;
      const qty = parseInt(document.getElementById('qty-input').value) || 1;
      CartService.add(p, qty);
      showToast(`${p.Marca} ${p.Modelo} (x${qty}) adicionado!`, 'success');
    }
    function buyNow() {
      addToCart();
      location.href = 'checkout.html';
    }
    loadProduct();
  </script>
</body>
</html>
